# Energy Co-Pilot — historyczny rejestr identyfikatorów HA.
# STAN: zapis wymagań z 2025-06-14, NIE weryfikacja działającej instalacji.
# NIE uruchamiać automatyki zapisu do HA wyłącznie na podstawie tego pliku.
schema_version: 1
source: "logic v5.1 + korekta ustna v5.1.1 (2025-06-14)"
verification: "not_checked_against_live_home_assistant"
entities:
  spot_price:
    entity_id: sensor.energi_data_spotpris
    domain: sensor
    access: read
    expected_unit: DKK/kWh
    expected_type: number
    actual_unit_verified: false
  hourly_price_forecast:
    entity_id: sensor.energi_data_service
    domain: sensor
    access: read
    expected_type: hourly_list
    json_location: unknown # state czy attributes, format cen i timestampy nieustalone
  battery_soc:
    entity_id: sensor.sun12k_battery_capacity
    domain: sensor
    access: read
    expected_unit: "%"
    expected_type: number
  pv_power:
    entity_id: sensor.pv_sum
    domain: sensor
    access: read
    expected_unit: kW
    expected_type: number
  home_power:
    entity_id: sensor.home_energy_consumption
    domain: sensor
    access: read
    expected_unit: kW
    expected_type: number
  pv_forecast_today:
    entity_id: sensor.energy_production_today
    domain: sensor
    access: read
    expected_unit: kWh
    expected_type: number
  pv_forecast_tomorrow:
    entity_id: sensor.energy_production_tomorrow
    domain: sensor
    access: read
    expected_unit: kWh
    expected_type: number
  pv_export_permission:
    entity_id: switch.sun12k_solar_sell
    domain: switch
    access: read_write
    intended_actions: [turn_on, turn_off]
  grid_charging_permission:
    entity_id: switch.sun12k_grid_charge
    domain: switch
    access: read_write
    intended_actions: [turn_on, turn_off]
    source: "user correction v5.1.1"
  pv_charge_current_limit:
    entity_id: number.sun12k_maximum_battery_grid_charge_current
    domain: number
    access: read_write
    intended_action: set_value
    unit: A
    mentioned_values: [1, 40]
    source: "v5.1.1 correction conflicts with v5.1 label and entity naming"
    device_semantics_verified: false
services:
  mobile_notification:
    service_id: notify.mobile_app_pixel_7dk
    verified: false
