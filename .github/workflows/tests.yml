name: Read-only integration
on:
  push:
    branches: [main, fix/issue-5-forecast-contract]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py

  open-review:
    if: github.event_name == 'push' && github.ref_name == 'fix/issue-5-forecast-contract'
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Open issue 5 review after successful validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/energy-issue5-pr.md <<EOF_REPORT
          Correct the Forecast.Solar contract confirmed by the HA export in #5: wh_period is indexed by interval end. Preserve partial intervals and final sunset Wh; never invent nighttime energy.

          Add a bounded per-quarter Recorder rejection audit, negative-home reasons and relevant RecorderRuns boundaries. Show actual Python last_reported and last_updated separately without relaxing live thresholds. No inverter commands, no M3-M6, no changes to the working price calculation.

          Raw forecast archives replay with the corrected contract. Legacy normalized-only forecasts remain preserved but cannot be replayed safely without original Wh maps.

          Validation: complete pytest suite, Ruff, formatting and documentation checks in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Regression fixtures are synthetic/anonymized; no private household history is committed.

          Release version: 0.1.2, with immutable tag and verifiable HACS package.

          Remaining evidence: the issue aggregates do not identify the exact rejected quarters or RecorderRuns. The new rejection audit enables their correlation; it does not claim that 8 negative quarters plus 2 gaps are necessarily ten distinct quarters. Actual post-update HA verification remains required. Do not merge automatically.

          Refs #5.
          EOF_REPORT
          existing=$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr view "$existing" --json url --jq '.url'
          else
            gh pr create --base main --head "$GITHUB_REF_NAME" \
              --title "Fix #5: Forecast.Solar end timestamps and Recorder rejection audit" \
              --body-file /tmp/energy-issue5-pr.md
          fi
