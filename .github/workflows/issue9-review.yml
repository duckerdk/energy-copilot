name: Prepare issue 9 review
on:
  push:
    branches: [fix/issue-9-live-synchronization]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the requested review without merging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git log -1 --format=%B > /tmp/issue9-report.txt
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('/tmp/issue9-report.txt').read_text().split('\n', 2)[-1].strip()
          payload = {
              'title': 'Fix #9: preserve as-of home measurements across Modbus report skew',
              'head': 'fix/issue-9-live-synchronization',
              'base': 'main',
              'body': report,
              'maintainer_can_modify': True,
          }
          Path('/tmp/issue9-pr.json').write_text(json.dumps(payload))
          PY
          if ! gh api repos/duckerdk/energy-copilot/pulls --method POST --input /tmp/issue9-pr.json > /tmp/issue9-result.json 2>/tmp/issue9-error; then
            echo "::error::$(head -c 1500 /tmp/issue9-error)"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('/tmp/issue9-result.json').read_text())['html_url'])
          PY
