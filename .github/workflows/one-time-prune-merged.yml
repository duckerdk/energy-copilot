name: One-time prune already-merged branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-prune-merged.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Remove approved branch refs with merged PRs only
        uses: actions/github-script@v7
        with:
          script: |
            const allowed = [
              "feat/github-pages-planner-lab",
              "feat/offline-planner-lab",
              "feat/planner-lab-continuous-dispatch",
              "feat/planner-lab-spot-and-real-load-profile",
              "feat/v1-13-continuous-horizon-and-plan-quality",
              "feat/whole-horizon-dispatch-v1.12.0",
              "feat/7-day-load-forecast-v1.11.0",
              "fix/forecast-solar-night-zero-boundaries",
              "fix/planner-lab-show-purchase-sale-amounts",
              "chore/cleanup-browser-only-lab-and-docs",
            ];
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "closed", per_page: 100,
            });
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            for (const name of allowed) {
              const matching = prs.find(pr =>
                pr.merged_at && pr.base.ref === "main" &&
                pr.head.repo?.full_name === context.repo.owner + "/" + context.repo.repo &&
                pr.head.ref === name
              );
              const branch = branches.find(item => item.name === name && !item.protected);
              if (!matching || !branch) {
                core.info("Skip unmerged, protected or absent ref: " + name);
                continue;
              }
              await github.rest.git.deleteRef({ owner, repo, ref: "heads/" + name });
              core.info("Deleted merged branch: " + name);
            }
