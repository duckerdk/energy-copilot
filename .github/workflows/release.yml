name: Versioned HACS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Validate tag, manifest and reproducible package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --output /tmp/energy-copilot-release

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build verified tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --output /tmp/energy-copilot-release
      - name: Publish once without moving or replacing a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cat > /tmp/energy-copilot-release-notes.md <<EOF_NOTES
          Energy Co-Pilot ${RELEASE_TAG}

          Source commit: ${RELEASE_COMMIT}
          Package: energy_copilot.zip (root integration layout for HACS).
          BUILD_INFO.json identifies every included source file; SHA256SUMS verifies the package.
          EOF_NOTES
          if [ "$RELEASE_TAG" = "v0.1.1" ]; then
            cat >> /tmp/energy-copilot-release-notes.md <<'EOF_CHANGES'

          M2 fixes: reconstruct Recorder state changes using real carry-in timestamps and process boundaries; retain explicit unavailable/unit errors and unknown recording pauses. Preserve already-started forecast intervals without prorating Wh, and report unpublished/internal forecast gaps without inventing nighttime zeros. Expose installed version, commit and payload integrity for HACS releases. Read-only; no inverter commands.
          EOF_CHANGES
          elif [ "$RELEASE_TAG" = "v0.1.2" ]; then
            cat >> /tmp/energy-copilot-release-notes.md <<'EOF_ISSUE5'

          Fix #5 Forecast.Solar interval semantics: Wh belongs to the interval ending at its timestamp, including the final short sunset period. Preserve the original energy of a partially elapsed interval and do not invent nighttime zeros. Add per-quarter Recorder rejection reasons, negative-home auditing, RecorderRuns context and Python report/change timestamps. Preserve but quarantine old normalized forecast history whose original end-indexed Wh is unavailable. Full synthetic/anonymized regression suite; no private household history, no price changes and no inverter commands.
          EOF_ISSUE5
          fi
          gh release create "$RELEASE_TAG" \
            /tmp/energy-copilot-release/energy_copilot.zip \
            /tmp/energy-copilot-release/SHA256SUMS \
            /tmp/energy-copilot-release/BUILD_INFO.json \
            --verify-tag --generate-notes --title "Energy Co-Pilot $RELEASE_TAG" \
            --notes-file /tmp/energy-copilot-release-notes.md
