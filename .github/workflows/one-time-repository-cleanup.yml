name: One-time repository retention cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-repository-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'duckerdk/energy-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preflight, delete old releases and merged branches, verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          from urllib import request, error
          
          repository = "duckerdk/energy-copilot"
          api_root = "https://api.github.com/repos/" + repository
          token = os.environ["GH_TOKEN"]
          keep = {"v2.0.3", "v2.0.2", "v2.0.1", "v2.0.0", "v1.16.19", "v1.16.18"}
          keep_branches = {"main", "fix/tou-state-guard-1161"}
          
          def api(path, method="GET"):
              req = request.Request(
                  api_root + "/" + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "one-time-energy-copilot-repository-cleanup",
                  },
                  method=method,
              )
              try:
                  with request.urlopen(req, timeout=40) as response:
                      payload = response.read()
                      return json.loads(payload) if payload else None
              except error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:400]
                  raise RuntimeError(f"GitHub {method} {path}: {exc.code}, {detail}") from exc
          
          def pages(path):
              result = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  batch = api(f"{path}{separator}per_page=100&page={page}")
                  if not isinstance(batch, list):
                      raise RuntimeError("Expected GitHub paginated list: " + path)
                  result += batch
                  if len(batch) < 100:
                      return result
                  page += 1
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError("Preflight failed: " + message)
          
          require(os.getenv("GITHUB_REPOSITORY") == repository, "unexpected repository")
          require(os.getenv("GITHUB_REF") == "refs/heads/main", "not running on main")
          manifest = json.loads(pathlib.Path("custom_components/energy_copilot/manifest.json").read_text())
          require(manifest.get("version") == "2.0.3", "manifest version changed")
          
          releases = pages("releases")
          branches = pages("branches")
          prs = pages("pulls?state=closed")
          refs = api("git/matching-refs/tags")
          tag_refs = {
              entry["ref"].removeprefix("refs/tags/")
              for entry in refs
              if entry["ref"].startswith("refs/tags/")
          }
          release_by_tag = {entry["tag_name"]: entry for entry in releases}
          require(len(releases) == 41 and len(release_by_tag) == 41, "release list changed")
          require(keep.issubset(release_by_tag), "one of the six rollback releases is absent")
          require(set(release_by_tag).issubset(tag_refs), "release tag is missing")
          for tag in keep:
              rel = release_by_tag[tag]
              require(not rel["draft"] and not rel["prerelease"], f"{tag} is draft/prerelease")
              assets = {x["name"] for x in rel["assets"]}
              require({"energy_copilot.zip", "BUILD_INFO.json", "SHA256SUMS"}.issubset(assets), f"{tag} missing HACS asset")
          
          old_releases = sorted(
              [entry for entry in releases if entry["tag_name"] not in keep],
              key=lambda entry: entry["tag_name"],
          )
          require(len(old_releases) == 35, "unexpected number of old releases")
          require(all(re.fullmatch(r"v\d+\.\d+\.\d+", x["tag_name"]) for x in old_releases), "non-semver release")
          branch_by_name = {entry["name"]: entry for entry in branches}
          require(len(branches) == 29 and len(branch_by_name) == 29, "branch list changed")
          require(keep_branches.issubset(branch_by_name), "preserved branch absent")
          require(branch_by_name["main"]["commit"]["sha"] == os.getenv("GITHUB_SHA"), "main advanced during cleanup")
          old_branches = sorted(
              [entry for entry in branches if entry["name"] not in keep_branches],
              key=lambda entry: entry["name"],
          )
          require(len(old_branches) == 27, "unexpected number of merged branches")
          for branch in old_branches:
              require(not branch["protected"], "protected branch: " + branch["name"])
              matching = [
                  pr for pr in prs
                  if pr["merged_at"]
                  and pr["head"]["ref"] == branch["name"]
                  and pr["head"]["sha"] == branch["commit"]["sha"]
                  and pr["base"]["ref"] == "main"
              ]
              require(len(matching) >= 1, "no merged PR at current SHA for " + branch["name"])
          
          print("PRECHECK PASSED: preserving", sorted(keep), "and branches", sorted(keep_branches), flush=True)
          print(f"DELETION PLAN: {len(old_releases)} releases and tags; {len(old_branches)} merged branches", flush=True)
          
          problems = []
          for release in old_releases:
              tag = release["tag_name"]
              try:
                  api(f"releases/{release['id']}", "DELETE")
                  api(f"git/refs/tags/{tag}", "DELETE")
                  print("Deleted release and tag:", tag, flush=True)
              except Exception as exc:
                  print("ERROR:", str(exc), flush=True)
                  problems.append(str(exc))
          
          for branch in old_branches:
              name = branch["name"]
              try:
                  current = api("branches/" + name)
                  if current["commit"]["sha"] != branch["commit"]["sha"]:
                      raise RuntimeError("branch SHA changed: " + name)
                  api("git/refs/heads/" + name, "DELETE")
                  print("Deleted merged branch:", name, flush=True)
              except Exception as exc:
                  print("ERROR:", str(exc), flush=True)
                  problems.append(str(exc))
          
          remaining_releases = pages("releases")
          remaining_branches = pages("branches")
          remaining_refs = api("git/matching-refs/tags")
          release_names = {x["tag_name"] for x in remaining_releases}
          branch_names = {x["name"] for x in remaining_branches}
          tags_left = {x["ref"].removeprefix("refs/tags/") for x in remaining_refs if x["ref"].startswith("refs/tags/")}
          if release_names != keep:
              problems.append("unexpected remaining releases: " + str(sorted(release_names)))
          if not keep.issubset(tags_left) or any(x["tag_name"] in tags_left for x in old_releases):
              problems.append("unexpected remaining tags")
          if branch_names != keep_branches:
              problems.append("unexpected remaining branches: " + str(sorted(branch_names)))
          print("POSTCHECK releases:", sorted(release_names), flush=True)
          print("POSTCHECK branches:", sorted(branch_names), flush=True)
          print("POSTCHECK obsolete tags left:", sorted(tags_left & {x["tag_name"] for x in old_releases}), flush=True)
          if problems:
              print("CLEANUP INCOMPLETE:", *problems, sep="\n", flush=True)
              sys.exit(1)
          print("SUCCESS: old releases, tags and merged branches removed; all six rollback versions kept.", flush=True)
          PY
