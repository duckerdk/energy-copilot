name: Publish HACS version from validated main

on:
  push:
    branches: [main]
    paths:
      - custom_components/energy_copilot/manifest.json
      - .github/workflows/publish-hacs-from-main.yml

permissions:
  contents: write

concurrency:
  group: publish-hacs-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'duckerdk/energy-copilot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Select immutable version tag
        id: version
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/energy_copilot/manifest.json"))["version"])')
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git show-ref --quiet --verify "refs/tags/$TAG"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create version tag
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Build verifiable HACS package
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: python scripts/build_release.py --tag "$TAG" --commit "$GITHUB_SHA" --output /tmp/energy-copilot-release
      - name: Publish GitHub Release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            /tmp/energy-copilot-release/energy_copilot.zip \
            /tmp/energy-copilot-release/SHA256SUMS \
            /tmp/energy-copilot-release/BUILD_INFO.json \
            --verify-tag --generate-notes --title "Energy Co-Pilot $TAG"
