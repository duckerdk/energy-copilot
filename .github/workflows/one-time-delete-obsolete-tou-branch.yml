name: Delete obsolete TOU test branch (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-delete-obsolete-tou-branch.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'duckerdk/energy-copilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and delete obsolete unmerged test branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib import request

          repo = "duckerdk/energy-copilot"
          target = "fix/tou-state-guard-1161"
          expected_sha = "b1f5cfbaba30d4f629768b1eacf65c4cab5b40f0"
          kept = {"v2.0.3", "v2.0.2", "v2.0.1", "v2.0.0", "v1.16.19", "v1.16.18"}
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/main"
          root = f"https://api.github.com/repos/{repo}/"
          def api(path, method="GET"):
              req = request.Request(root + path, method=method, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "one-time-branch-cleanup",
              })
              with request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          branches = api("branches?per_page=100")
          by_name = {branch["name"]: branch for branch in branches}
          assert set(by_name) == {"main", target}, "branch list changed; aborting"
          assert by_name[target]["commit"]["sha"] == expected_sha, "target SHA changed; aborting"
          assert not by_name[target]["protected"], "target protected; aborting"
          releases = api("releases?per_page=100")
          assert {release["tag_name"] for release in releases} == kept, "release list changed; aborting"
          print(f"Deleting obsolete branch {target} at {expected_sha}", flush=True)
          api("git/refs/heads/" + target, "DELETE")
          after = api("branches?per_page=100")
          assert {branch["name"] for branch in after} == {"main"}, "unexpected branches remain"
          print("SUCCESS: only main remains, with the existing releases untouched.", flush=True)
          PY
