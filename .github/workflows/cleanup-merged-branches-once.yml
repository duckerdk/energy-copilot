name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches-once.yml'
permissions:
  contents: write
  pull-requests: read
  statuses: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified merged branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "duckerdk/energy-copilot"
          deleted=0
          while IFS='|' read -r number branch expected; do
            case "$branch" in
              main|master|''|v*) echo "Unsafe branch: $branch"; exit 1 ;;
            esac
            pr_merged=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.merged_at // ""')
            pr_branch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.ref')
            if [ -z "$pr_merged" ] || [ "$pr_branch" != "$branch" ]; then
              echo "PR #$number is not a matching merged PR for $branch"; exit 1
            fi
            actual=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null) || {
              echo "Already absent: $branch"
              continue
            }
            if [ "$actual" != "$expected" ]; then
              echo "Branch changed since audit: $branch"; exit 1
            fi
            pr_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.head.sha')
            if [ "$pr_head" != "$actual" ]; then
              ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/$branch...main" --jq '.behind_by')
              if [ "$ahead" != "0" ]; then
                echo "Unmerged new commits on branch $branch"; exit 1
              fi
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            deleted=$((deleted + 1))
            echo "Deleted merged branch: $branch"
          done <<'BRANCHES'
          1|audit/codex-spec-cleanup-2026-10-20|b127aaca4272434ab45a3f6d553605cc12a72358
          8|docs/negative-home-clamp-policy-2026-10-20|156b1f0ff3ad45adcaf9253a0dc81f4f128feac9
          4|docs/release-versioning-and-ha-quality-2026-10-20|6bc84f7a80c5f5eb879ec899ebf4eb413ec7f860
          6|docs/verify-real-ha-payload-2026-10-20|faa0b6cca44f01707250e72a2073d09922e4abec
          2|feat/m1-m2-read-only|af9c8bf90b8a8cc914d399426e23b2147c3ceca9
          3|fix/ha-real-data-diagnostics-2026-10-20|c85d20540df7d58b613bb6af39fb9c5d36036ac1
          7|fix/issue-5-forecast-contract|ff7948c2c655a476fde5cacd28cd2837b3c17a3c
          10|fix/issue-9-live-synchronization|7e805c3a4553457c24906406df5e4ee0d263f1c0
          11|fix/pvsum-only-release-v014|11429b187102ffb2b80baa9d50fd5d97af640d2b
          12|fix/0.1.5-night-quality|8e6526903cd9091da6bcf3e8320cb1464f517d28
          BRANCHES
          echo "Merged branch refs deleted: $deleted"
      - name: Report branch cleanup result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="repository-branch-cleanup" \
            -f description="Verified merged branch cleanup: $JOB_STATUS" -f target_url="$RUN_URL"
