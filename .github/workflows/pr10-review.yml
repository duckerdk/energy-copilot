name: Update PR 10 review report
on:
  push:
    branches: [fix/issue-9-live-synchronization]
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the existing draft with the committed review report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api repos/duckerdk/energy-copilot/pulls/10 > /tmp/pr10.json 2>/tmp/pr10-error; then
            echo "::error::$(head -c 1500 /tmp/pr10-error)"
            exit 1
          fi
          git log -1 --format=%B > /tmp/pr10-report.txt
          python - <<'PY'
          import json
          from pathlib import Path
          pr = json.loads(Path('/tmp/pr10.json').read_text())
          assert pr['head']['ref'] == 'fix/issue-9-live-synchronization'
          assert pr['base']['ref'] == 'main' and pr['state'] == 'open' and pr['draft']
          body = Path('/tmp/pr10-report.txt').read_text().split('\n', 2)[-1].strip()
          Path('/tmp/pr10-update.json').write_text(json.dumps({'body': body}))
          PY
          if ! gh api repos/duckerdk/energy-copilot/pulls/10 --method PATCH --input /tmp/pr10-update.json > /dev/null 2>/tmp/pr10-error; then
            echo "::error::$(head -c 1500 /tmp/pr10-error)"
            exit 1
          fi
