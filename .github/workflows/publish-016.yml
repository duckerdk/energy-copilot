name: Publish Energy Co-Pilot v0.1.6 to HACS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-016.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Publish verified HACS package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/energy_copilot/manifest.json"))["version"])')" = "0.1.6"
          if gh release view v0.1.6 >/dev/null 2>&1; then
            echo "v0.1.6 already published"
            exit 0
          fi
          git tag v0.1.6 "$GITHUB_SHA"
          python scripts/build_release.py --tag v0.1.6 --commit "$GITHUB_SHA" --output /tmp/ec-release
          gh release create v0.1.6 /tmp/ec-release/energy_copilot.zip /tmp/ec-release/SHA256SUMS /tmp/ec-release/BUILD_INFO.json --target "$GITHUB_SHA" --title "Energy Co-Pilot v0.1.6" --notes "Fix stable zero PV acceptance and asynchronous HA sensor timestamps; retain fault/recovery guards and explicit Forecast.Solar gaps. Read-only."
