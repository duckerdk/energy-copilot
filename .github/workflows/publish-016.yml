name: Publish v0.1.6 once (verified HACS)

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Create immutable version tag and publish HACS package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(python -c 'import json;print(json.load(open("custom_components/energy_copilot/manifest.json"))["version"])')" = "0.1.6"
          if gh release view v0.1.6 >/dev/null 2>&1; then
            echo "v0.1.6 already published; not replacing it."
            exit 0
          fi
          if git ls-remote --exit-code origin refs/tags/v0.1.6 >/dev/null 2>&1; then
            echo "v0.1.6 already tagged without release; stopping to avoid ambiguity."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v0.1.6 "$RELEASE_COMMIT"
          git push origin refs/tags/v0.1.6
          python scripts/build_release.py --tag v0.1.6 --commit "$RELEASE_COMMIT" --output /tmp/energy-copilot-release
          printf '%s\n' 'Energy Co-Pilot v0.1.6 — source of PV power: sensor.pv_sum only.' 'No PV1/PV2 input mapping or blocking. Read-only M2.' 'Unchanged nighttime sensor.pv_sum=0 W is valid; asynchronous HA reports do not create false faults.' 'Night/day real HA diagnostics are still required to verify field operation.' > /tmp/energy-copilot-notes.md
          gh release create v0.1.6 /tmp/energy-copilot-release/energy_copilot.zip /tmp/energy-copilot-release/SHA256SUMS /tmp/energy-copilot-release/BUILD_INFO.json --verify-tag --title "Energy Co-Pilot v0.1.6" --notes-file /tmp/energy-copilot-notes.md
      - name: Report HACS publication outcome for diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="hacs-v0.1.6" \
            -f description="HACS v0.1.6: $JOB_STATUS" -f target_url="$RUN_URL"
