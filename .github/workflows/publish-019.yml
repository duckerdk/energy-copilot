name: Publish Energy Co-Pilot v0.1.9 to HACS
# Re-run after correcting version assertions; checks gate tag and release.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-019.yml'
permissions:
  contents: write
  statuses: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Publish verified HACS package once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("custom_components/energy_copilot/manifest.json"))["version"])')" = "0.1.9"
          if gh release view v0.1.9 >/dev/null 2>&1; then
            echo "v0.1.9 already published"
            exit 0
          fi
          if [ -n "$(git tag -l v0.1.9)" ]; then
            echo "Refusing to replace existing v0.1.9 tag"
            exit 1
          fi
          git tag v0.1.9 "$GITHUB_SHA"
          python scripts/build_release.py --tag v0.1.9 --commit "$GITHUB_SHA" --output /tmp/energy-copilot-release
          git push origin v0.1.9
          gh release create v0.1.9 /tmp/energy-copilot-release/energy_copilot.zip /tmp/energy-copilot-release/SHA256SUMS /tmp/energy-copilot-release/BUILD_INFO.json --verify-tag --title "Energy Co-Pilot v0.1.9" --notes "M3 read-only dry_run regression: explicitly labeled constant-power integration of hourly and irregular Forecast.Solar energy periods into 15-minute preview, energy-conserving and no invented missing Wh. Diagnostics expose unverified intraperiod model and modeled quarter count. No inverter commands; M1/M2 input quality unchanged."
      - name: Report HACS publication outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then STATE=success; else STATE=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$STATE" -f context="hacs-v0.1.9" \
            -f description="HACS v0.1.9: $JOB_STATUS" -f target_url="$RUN_URL"
