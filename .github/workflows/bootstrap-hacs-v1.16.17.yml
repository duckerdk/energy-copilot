name: Bootstrap HACS v1.16.17
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-hacs-v1.16.17.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Validate manifest and HACS packaging contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/energy_copilot/manifest.json").read_text())
          hacs = json.loads(Path("hacs.json").read_text())
          assert manifest["version"] == "1.16.17", manifest["version"]
          assert hacs["zip_release"] is True and hacs["filename"] == "energy_copilot.zip"
          PY
      - name: Create immutable version tag after passing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api repos/${{ github.repository }}/git/ref/tags/v1.16.17 >/tmp/existing-tag.json 2>/dev/null; then
            echo "Release tag already exists; refusing to move it"
            exit 1
          fi
          gh api repos/${{ github.repository }}/git/refs -f ref=refs/tags/v1.16.17 -f sha="${GITHUB_SHA}"
          git fetch origin tag v1.16.17
      - name: Build reproducible verified release
        run: python scripts/build_release.py --tag v1.16.17 --commit "$GITHUB_SHA" --output /tmp/energy-copilot-release
      - name: Publish HACS release with ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.16.17 \
            /tmp/energy-copilot-release/energy_copilot.zip \
            /tmp/energy-copilot-release/SHA256SUMS \
            /tmp/energy-copilot-release/BUILD_INFO.json \
            --verify-tag --title "Energy Co-Pilot v1.16.17" \
            --notes "Allow real PV surplus to charge beyond forecast SOC; remove forecast-driven 1 A current throttling. Forecast SOC remains informational." 
