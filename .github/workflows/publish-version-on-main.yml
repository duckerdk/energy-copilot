name: Publish verified HACS release

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/energy_copilot/**'
      - 'tests/**'
      - 'scripts/build_release.py'
      - 'requirements-test.txt'
      - '.github/workflows/publish-version-on-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: energy-copilot-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'duckerdk/energy-copilot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts/build_release.py
      - run: ruff format --check custom_components tests scripts/build_release.py
      - run: pytest --cov=custom_components.energy_copilot --cov-report=term-missing
      - run: python scripts/check_docs.py
      - name: Locate immutable source and verify release state
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/energy_copilot/manifest.json"))["version"])')"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              echo "Published release has no matching local tag: $TAG" >&2
              exit 1
            fi
            if ! git diff --quiet "$TAG" "$GITHUB_SHA" -- custom_components/energy_copilot; then
              echo "Integration changed after $TAG without a manifest version bump." >&2
              exit 1
            fi
            echo "Release already exists; verifying its artifacts."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            if git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
              TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
              if ! git merge-base --is-ancestor "$TAG_COMMIT" "$GITHUB_SHA"; then
                echo "Existing tag is not an ancestor of main: $TAG" >&2
                exit 1
              fi
              if ! git diff --quiet "$TAG_COMMIT" "$GITHUB_SHA" -- custom_components/energy_copilot; then
                echo "Orphan release tag contains different integration code; use a new version." >&2
                exit 1
              fi
            else
              git config user.name github-actions
              git config user.email github-actions@users.noreply.github.com
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
              TAG_COMMIT="$GITHUB_SHA"
            fi
            echo "commit=${TAG_COMMIT}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build reproducible package from tagged source
        if: steps.version.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          TAG_COMMIT: ${{ steps.version.outputs.commit }}
        run: python scripts/build_release.py --tag "$TAG" --commit "$TAG_COMMIT" --output /tmp/energy-copilot-release
      - name: Publish once
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            /tmp/energy-copilot-release/energy_copilot.zip \
            /tmp/energy-copilot-release/SHA256SUMS \
            /tmp/energy-copilot-release/BUILD_INFO.json \
            --verify-tag --generate-notes --title "Energy Co-Pilot $TAG"
      - name: Verify published release and required assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,assets,tagName \
            --jq 'select(.isDraft == false and .tagName == env.TAG)
                  | [.assets[].name] as $assets
                  | select((["energy_copilot.zip", "SHA256SUMS", "BUILD_INFO.json"] - $assets) | length == 0)
                  | .tagName' | grep -Fx "$TAG"
          mkdir -p /tmp/energy-copilot-verified
          gh release download "$TAG" --pattern "energy_copilot.zip" --pattern "SHA256SUMS" --pattern "BUILD_INFO.json" --dir /tmp/energy-copilot-verified
          (cd /tmp/energy-copilot-verified && sha256sum -c SHA256SUMS)
          test "$(python -c 'import json; print(json.load(open("/tmp/energy-copilot-verified/BUILD_INFO.json"))["tag"])')" = "$TAG"
          echo "Verified complete published release and ZIP checksum: $TAG"
